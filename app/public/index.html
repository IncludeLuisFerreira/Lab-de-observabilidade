<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerência de Redes - Observabilidade</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>🔧 Gerência de Redes</h1>
        <p class="subtitle">Lab de Observabilidade</p>
      </div>
      <div class="status-bar">
        <span><span class="dot" id="status-dot"></span> <span id="status-text">Verificando...</span></span>
        <span id="user-display" class="hidden">👤 <span id="username"></span></span>
        <button class="btn-sm secondary hidden" id="logout-btn" onclick="auth.logout()">Sair</button>
      </div>
    </header>

    <!-- AUTH -->
    <section id="auth-section" class="card">
      <div class="tabs">
        <button class="tab active" data-tab="login">Login</button>
        <button class="tab" data-tab="register">Cadastrar</button>
      </div>
      <div id="login-form">
        <input type="text" id="login-user" placeholder="Usuário">
        <input type="password" id="login-pass" placeholder="Senha">
        <button onclick="auth.login()">Entrar</button>
      </div>
      <div id="register-form" class="hidden">
        <input type="text" id="reg-user" placeholder="Usuário">
        <input type="password" id="reg-pass" placeholder="Senha">
        <input type="email" id="reg-email" placeholder="E-mail">
        <button onclick="auth.register()">Cadastrar</button>
      </div>
      <div id="auth-msg" class="message"></div>
    </section>

    <!-- DASHBOARD -->
    <main id="dashboard" class="hidden">
      <div class="grid">
        <!-- PRODUTOS -->
        <section class="card full-width">
          <h2>🍎 Estoque de Alimentos</h2>
          <div class="form-inline">
            <input type="text" id="prod-name" placeholder="Nome do Produto">
            <input type="text" id="prod-cat" placeholder="Categoria" style="width: 120px;">
            <input type="text" id="prod-unit" placeholder="Unid." style="width: 80px;">
            <input type="number" id="prod-stock" placeholder="Estoque Inicial" style="width: 100px;">
            <input type="number" id="prod-min" placeholder="Estoque Mín." style="width: 100px;">
            <button onclick="inventory.addProduct()">Adicionar</button>
          </div>
          <table>
            <thead>
              <tr><th>ID</th><th>Nome</th><th>Cat.</th><th>Unid.</th><th>Estoque</th><th>Mín.</th><th>Ações</th></tr>
            </thead>
            <tbody id="products-table"></tbody>
          </table>
        </section>

        <!-- MOVIMENTAÇÕES -->
        <section class="card">
          <h2>🛒 Entrada/Saída</h2>
          <div class="form-stacked">
            <label>Produto:</label>
            <select id="mov-product" style="width: 100%; padding: 8px; margin-bottom: 12px; background: #0f172a; color: white; border-radius: 4px;"></select>
            <label>Quantidade:</label>
            <input type="number" id="mov-qty" value="1">
            <div class="sim-grid">
              <button class="btn secondary" onclick="inventory.registerPurchase()">➕ Compra</button>
              <button class="btn warning" onclick="inventory.registerSale()">➖ Venda</button>
            </div>
          </div>
        </section>

        <!-- HISTÓRICO -->
        <section class="card">
          <h2>⏳ Histórico</h2>
          <div class="log-panel" id="inventory-history">
            Selecione um produto para ver o histórico...
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
